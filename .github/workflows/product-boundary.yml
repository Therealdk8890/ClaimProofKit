name: Product boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Apache-2.0 license surface
        run: bash scripts/check-license-surface.sh
      - name: Check ClaimProofCloud boundary
        run: bash scripts/check-product-boundary.sh
      - name: Test boundary guard
        run: bash scripts/test-product-boundary.sh
